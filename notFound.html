<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f41a4a" />
    <title>404 - Page Not Found | Adrian Hafezi</title>
    <link rel="stylesheet" href="/css/notFount.css" />
    <link rel="stylesheet" href="/fonts/css/all.css" />
  </head>
  <body>
    <div class="notfound-container">
      <div class="notfound-content">
        <!-- Animated numbers -->
        <div class="notfound-numbers">
          <span class="number">4</span>
          <span class="zero">
            <i class="fa-regular fa-circle"></i>
          </span>
          <span class="number">4</span>
        </div>

        <!-- Error message -->
        <h1 class="notfound-title">Oops! Page not found</h1>
        <p class="notfound-text">
          The page you are looking for might have been moved, deleted, or never
          existed.
        </p>

        <!-- Buttons -->
        <div class="notfound-buttons">
          <a href="/index.html" class="btn-home">
            <i class="fa-solid fa-house"></i>
            Back to Home
          </a>
          <a href="/pages/contactMe.html" class="btn-contact">
            <i class="fa-solid fa-envelope"></i>
            Contact Me
          </a>
        </div>

        <!-- Fun suggestion -->
        <div class="notfound-suggestion">
          <i class="fa-solid fa-lightbulb"></i>
          <p>
            Try going back to <a href="/index.html">homepage</a> or check the URL
          </p>
        </div>
      </div>

      <!-- Decorative shapes -->
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
    </div>
  </body>
</html>
