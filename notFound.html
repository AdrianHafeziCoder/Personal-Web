<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f41a4a" />
    <title>404 - Page Not Found | Adrian Hafezi</title>
    <link rel="stylesheet" href="css/notFount.css" />
    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="fonts/css/all.css" />
    <!-- ICON -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23f41a4a'/%3E%3Cstop offset='100%25' style='stop-color:%239b59b6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='45' fill='url(%23grad)' stroke='white' stroke-width='2.5'/%3E%3Ctext x='50' y='67' font-size='44' text-anchor='middle' fill='white' font-weight='bold' font-family='Arial'%3EA%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!-- Gradient Trail Line -->
    <canvas id="trailCanvas"></canvas>

    <div class="notfound-container">
      <div class="notfound-content">
        <!-- Animated numbers -->
        <div class="notfound-numbers">
          <span class="number">4</span>
          <span class="zero">
            <i class="fa-regular fa-circle"></i>
          </span>
          <span class="number">4</span>
        </div>

        <!-- Error message -->
        <h1 class="notfound-title">Oops! Page not found</h1>
        <p class="notfound-text">
          The page you are looking for might have been moved, deleted, or never
          existed.
        </p>

        <!-- Buttons -->
        <div class="notfound-buttons">
          <a href="index.html" class="btn-home">
            <i class="fa-solid fa-house"></i>
            Back to Home
          </a>
          <a href="pages/contactMe.html" class="btn-contact">
            <i class="fa-solid fa-envelope"></i>
            Contact Me
          </a>
        </div>

        <!-- Fun suggestion -->
        <div class="notfound-suggestion">
          <i class="fa-solid fa-lightbulb"></i>
          <p>
            Try going back to <a href="index.html">homepage</a> or check the URL
          </p>
        </div>
      </div>

      <!-- Decorative shapes -->
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
